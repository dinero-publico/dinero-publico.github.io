name: Actualizar datos y publicar web

on:
  schedule:
    # Todos los días a las 07:17 UTC (Hacienda publica en horario de mañana).
    - cron: "17 7 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests de los parsers
        run: python -m pytest -q

      - name: Descargar datos de Hacienda
        if: github.event_name != 'push'
        run: python scripts/fetch_data.py

      - name: Guardar cambios en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin datos nuevos."
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Preparar la web
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: datos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
